<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>102201</title>
<meta name="description" content="102201.com — 正着念、倒着念，都是它。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --digit-fs: 96px;
    --ink: #0a0b10;
    --ink-2: #12141c;
    --ivory: #f3edde;
    --amber: #e8a33d;
    --amber-dim: rgba(232,163,61,0.35);
    --muted: rgba(243,237,222,0.45);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(120% 140% at 50% 20%, var(--ink-2) 0%, var(--ink) 60%);
    color: var(--ivory);
    font-family: 'Manrope', sans-serif;
    overflow-x:hidden;
  }

  .stage{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 8vh 6vw 6vh;
    text-align:center;
  }

  .eyebrow{
    font-size: clamp(13px, 1.6vw, 16px);
    letter-spacing: 0.14em;
    color: var(--muted);
    margin-bottom: clamp(24px, 5vh, 44px);
    font-weight:500;
  }

  .board-wrap{
    --mx: 0;
    --my: 0;
    --axis-glow: 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    perspective: 900px;
  }

  .board{
    display:flex;
    align-items:baseline;
    transform-style: preserve-3d;
    transform: rotateY(calc(var(--mx) * 9deg)) rotateX(calc(var(--my) * -7deg));
    transition: transform .25s cubic-bezier(.2,.7,.3,1);
    will-change: transform;
  }

  .digits{
    position:relative;
    display:flex;
  }

  .char{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: var(--digit-fs);
    line-height:1;
    color: var(--ivory);
    letter-spacing: 0.02em;
    display:inline-block;
    padding: 0 0.06em;
    user-select:none;
  }

  .suffix{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: calc(var(--digit-fs) * 0.4);
    color: var(--amber);
    margin-left: 6px;
    align-self:flex-end;
    padding-bottom: 0.14em;
    user-select:none;
  }

  .mirror-axis{
    position:absolute;
    top: 6%;
    bottom: 6%;
    left: 50%;
    width: 2px;
    background: var(--amber);
    transform: translateX(-50%) scaleY(1);
    transform-origin:center;
    opacity: .35;
    border-radius:2px;
    pointer-events:none;
  }

  .reflection{
    margin-top: 8px;
    transform: scaleY(-1) rotateY(calc(var(--mx) * 9deg)) rotateX(calc(var(--my) * 7deg));
    transition: transform .25s cubic-bezier(.2,.7,.3,1);
    opacity: 0.22;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent 65%);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent 65%);
    pointer-events:none;
    filter: blur(0.3px);
    will-change: transform;
  }

  .tagline-space{ height: clamp(28px, 5vh, 48px); }

  .cta{
    margin-top: clamp(36px, 6vh, 60px);
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: clamp(20px, 3vw, 28px);
    color: var(--amber);
    text-decoration:none;
    padding: 10px 6px;
    border-bottom: 1px solid var(--amber-dim);
    transition: border-color .25s ease, transform .25s ease;
  }
  .cta:hover{ border-color: var(--amber); transform: translateY(-2px); }
  .cta:focus-visible{ outline: 2px solid var(--amber); outline-offset: 4px; border-radius: 4px; }
  .cta .arrow{ transition: transform .25s ease; }
  .cta:hover .arrow{ transform: translateX(4px); }

  .footer{
    position:fixed;
    left:0; right:0; bottom: 20px;
    text-align:center;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: rgba(243,237,222,0.28);
    pointer-events:none;
  }

  @media (max-width: 640px){
    :root{ --digit-fs: 52px; }
  }
  @media (max-width: 380px){
    :root{ --digit-fs: 42px; }
  }

  /* ---- Animation: characters materialize from both ends toward the center,
     mirroring the fact that 102201 reads the same forward and backward ---- */
  @media (prefers-reduced-motion: no-preference){

    .eyebrow, .cta{
      opacity:0;
      animation: fadeUp .7s ease-out forwards;
    }
    .eyebrow{ animation-delay: .05s; }
    .cta{ animation-delay: 1.9s; }
    .suffix{ opacity:0; animation: fadeUp .7s ease-out 1.9s forwards; }

    .char{
      opacity:0;
      animation: materialize .55s cubic-bezier(.2,.8,.2,1) forwards;
    }
    .char:nth-child(1), .char:nth-child(6){ animation-delay: .15s; }
    .char:nth-child(2), .char:nth-child(5){ animation-delay: .48s; }
    .char:nth-child(3), .char:nth-child(4){ animation-delay: .81s; }

    .mirror-axis{
      opacity:0;
      transform: translateX(-50%) scaleY(0);
      animation: axisReveal .6s ease-out 1.2s forwards,
                 axisPulse 4s ease-in-out 1.95s infinite;
    }
  }

  @keyframes materialize{
    0%{
      opacity:0;
      transform: scale(.4);
      filter: blur(6px);
      color: var(--amber);
      text-shadow: 0 0 22px var(--amber);
    }
    55%{
      opacity:1;
      transform: scale(1.08);
      filter: blur(0px);
      color: var(--amber);
      text-shadow: 0 0 14px var(--amber-dim);
    }
    100%{
      opacity:1;
      transform: scale(1);
      filter: blur(0px);
      color: var(--ivory);
      text-shadow: none;
    }
  }

  @keyframes axisReveal{
    0%{ opacity:0; transform: translateX(-50%) scaleY(0); box-shadow: none; }
    45%{ opacity:1; transform: translateX(-50%) scaleY(1.25); box-shadow: 0 0 28px var(--amber); }
    100%{ opacity:.35; transform: translateX(-50%) scaleY(1); box-shadow: none; }
  }

  @keyframes axisPulse{
    0%, 100%{
      opacity: calc(.3 + var(--axis-glow, 0) * .55);
      box-shadow: 0 0 calc(6px + var(--axis-glow, 0) * 30px) var(--amber);
    }
    50%{
      opacity: calc(.4 + var(--axis-glow, 0) * .55);
      box-shadow: 0 0 calc(10px + var(--axis-glow, 0) * 34px) var(--amber);
    }
  }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="eyebrow">有些域名，正着念、倒着念，都是它</div>

    <div class="board-wrap">
      <div class="board">
        <div class="digits">
          <span class="char">1</span><span class="char">0</span><span class="char">2</span><span class="char">2</span><span class="char">0</span><span class="char">1</span>
          <div class="mirror-axis" aria-hidden="true"></div>
        </div>
        <span class="suffix">.com</span>
      </div>
      <div class="board reflection" aria-hidden="true">
        <div class="digits">
          <span class="char">1</span><span class="char">0</span><span class="char">2</span><span class="char">2</span><span class="char">0</span><span class="char">1</span>
        </div>
        <span class="suffix">.com</span>
      </div>
    </div>

    <a class="cta" href="https://www.102201.com" target="_blank" rel="noopener">
      www.102201.com <span class="arrow">→</span>
    </a>
  </div>

  <div class="footer">102201</div>

<script>
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;

  var wrap = document.querySelector('.board-wrap');
  if (!wrap) return;

  function setVars(mx, my, glow){
    wrap.style.setProperty('--mx', mx.toFixed(3));
    wrap.style.setProperty('--my', my.toFixed(3));
    wrap.style.setProperty('--axis-glow', glow.toFixed(3));
  }

  function onMove(e){
    var rect = wrap.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var halfW = rect.width / 2 || 1;
    var halfH = rect.height / 2 || 1;

    var mx = Math.max(-1, Math.min(1, (e.clientX - cx) / halfW));
    var my = Math.max(-1, Math.min(1, (e.clientY - cy) / halfH));
    var glow = Math.max(0, 1 - Math.abs(mx)); // brightest when cursor is over the mirror line

    setVars(mx, my, glow);
  }

  function onLeave(){
    setVars(0, 0, 0);
  }

  window.addEventListener('mousemove', onMove, { passive: true });
  window.addEventListener('mouseleave', onLeave);
})();
</script>

</body>
</html>
