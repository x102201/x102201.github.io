<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>x102201 — Projects</title>
    <meta
      name="description"
      content="Personal project showcase. Explore DSHHelper and other repositories."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="projects/dsh-helper/banner/en/banner.css" />
    <script src="js/lang.js"></script>
  </head>
  <body>
    <header class="site-nav">
      <a class="site-nav__brand" href="./">x102201</a>
      <nav class="site-lang" aria-label="Language">
        <a href="./" data-lang-switch="en" class="is-active" hreflang="en">EN</a>
        <span class="site-lang__sep" aria-hidden="true">|</span>
        <a href="zh/" data-lang-switch="zh" hreflang="zh-CN">中文</a>
      </nav>
    </header>

    <main class="site-main">
      <a
        class="banner-dsh-helper"
        href="projects/dsh-helper/detail/"
        aria-label="DSHHelper — Many harnesses. One desktop."
      >
        <div class="banner-dsh-helper__inner">
          <div class="banner-dsh-helper__copy">
            <div class="banner-dsh-helper__brand">
              <img
                class="banner-dsh-helper__logo"
                src="projects/dsh-helper/assets/logo.png"
                alt=""
                width="44"
                height="44"
              />
              <span class="banner-dsh-helper__name">DSHHelper</span>
            </div>
            <h1 class="banner-dsh-helper__title">Many harnesses. One desktop.</h1>
            <p class="banner-dsh-helper__lede">
              Run isolated DeepSeek Harness workspaces side by side — built-in
              runtime, quad-pane layout, shareable <code>.dshpack</code> packages.
            </p>
            <p class="banner-dsh-helper__cta">Explore project <span aria-hidden="true">→</span></p>
          </div>
          <div class="banner-dsh-helper__visual">
            <img
              src="projects/dsh-helper/assets/en/screenshot-main-light.png"
              alt="DSHHelper quad-pane workbench in light appearance"
              width="1200"
              height="750"
              loading="eager"
            />
          </div>
        </div>
      </a>
    </main>

    <footer class="site-footer">
      <p>Personal GitHub Pages showcase · <a href="https://github.com/x102201">github.com/x102201</a></p>
    </footer>

    <script src="js/projects.js" defer></script>
  </body>
</html>
